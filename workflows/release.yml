name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish
        run: dotnet publish Jellyfin.Plugin.CleanPlay/Jellyfin.Plugin.CleanPlay.csproj -c Release -o publish "-p:Version=${VERSION}"

      - name: Package
        run: python3 scripts/package.py "$VERSION" publish "artifacts/cleanplay_${VERSION}.zip" "${GITHUB_REPOSITORY_OWNER}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/cleanplay_*.zip
          generate_release_notes: true

      - name: Update manifest.json on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          python3 scripts/update_manifest.py "$VERSION" "artifacts/cleanplay_${VERSION}.zip" "$GITHUB_REPOSITORY" manifest.json
          git add manifest.json
          git commit -m "Update manifest for v${VERSION}"
          git push origin main
